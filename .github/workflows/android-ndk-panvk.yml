name: Android NDK Build (libvulkan_panfrost Patched & Unpatched Variants)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-android-libvulkan_panfrost:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build-type: [debugoptimized, release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential \
              cmake \
              llvm-20-dev \
              libclang-20-dev \
              libclc-20-dev \
              libllvmspirvlib-20-dev \
              libelf-dev \
              spirv-tools \
              spirv-tools-dev \
              bison \
              flex \
              libdrm-dev \
              libvulkan-dev \
              libvulkan1 \
              libxcb1-dev \
              libx11-xcb-dev \
              libxcb-randr0-dev \
              libxcb-dri3-dev \
              libxcb-present-dev \
              libxcb-shm0-dev \
              libxcb-sync-dev \
              libxcb-xfixes0-dev \
              libxshmfence-dev \
              libx11-dev \
              libxext-dev \
              libxrandr-dev \
              gettext-base \
              unzip \
              wget \
              pkg-config
          python -m pip install --upgrade pip
          pip install mako PyYAML meson ninja packaging ortools

      - name: Download Upstream Mesa 26.3.0 Source into mesa/
        run: |
          wget -q -O mesa-src.zip \
            "https://github.com/leegao/panthor2kbase/releases/download/mesa-5a07217f034b3e50d8c7c7794f97a2df1742613b/mesa-5a07217f034b3e50d8c7c7794f97a2df1742613b.zip"
          unzip -q mesa-src.zip
          if [ -d "mesa-5a07217f034b3e50d8c7c7794f97a2df1742613b" ]; then
            mv mesa-5a07217f034b3e50d8c7c7794f97a2df1742613b mesa
          fi
          rm -f mesa-src.zip
          # Apply standard NDK memfd_create and libudev host/cross fixes before building host tools
          sed -i 's/#if defined(HAVE_MEMFD_CREATE) \&\& !defined __TERMUX__/#if defined(HAVE_MEMFD_CREATE)/' mesa/src/util/anon_file.c
          sed -i "s/dep_libudev = dependency('libudev', required : false)/dep_libudev = null_dep/g" mesa/meson.build

      - name: Create mesa_overlay vs mesa diff patch (additions/modifications only)
        run: |
          # mesa_overlay is an overlay (not a full repo), so only emit additions
          # and modifications; skip deletions of files that exist only in mesa
          (
            cd mesa_overlay
            find . -type f | sort | while read -r f; do
              if [ -f "../mesa/$f" ]; then
                diff -u --label "a/$f" --label "b/$f" "../mesa/$f" "$f" || true
              else
                echo "--- /dev/null"
                echo "+++ b/$f"
                cat "$f" || true
              fi
            done
          ) > mesa_overlay.patch || true

      - name: Build C++ Adapter & Verification Tooling via CMake (Host & Android NDK)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cmake -B build-x86-64 -G Ninja -DPANTHOR_KBASE_BUILD_TESTS=ON
          cmake --build build-x86-64
          cp -f build-x86-64/libvulkan_panfrost_patched.so ./libvulkan_panfrost_patched.so
          ctest --test-dir build-x86-64 --output-on-failure

          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DPANTHOR_KBASE_BUILD_TESTS=OFF
          cmake --build build-android

      - name: Generate Shims
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          chmod +x scripts/generate_shims.sh
          ./scripts/generate_shims.sh

      - name: Generate Host Tools (build-x86-64/mesa BEFORE applying mesa_overlay)
        env:
          LLVM_CONFIG: /usr/bin/llvm-config-20
        run: |
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
          export LLVM_CONFIG=/usr/bin/llvm-config-20

          meson setup build-x86-64/mesa mesa \
              -Dplatforms=[] \
              -Dgallium-drivers=[] \
              -Dvulkan-drivers=[] \
              -Dtools=panfrost \
              -Dprecomp-compiler=enabled \
              -Dinstall-precomp-compiler=true \
              -Dllvm=enabled \
              -Dmesa-clc=enabled -Dinstall-mesa-clc=true

          ninja -C build-x86-64/mesa src/compiler/clc/mesa_clc src/compiler/spirv/vtn_bindgen2 src/panfrost/clc/panfrost_compile
          ln -sf "$MESON_WORKING_DIR/build-x86-64/mesa/src/compiler/clc/mesa_clc" "$MESON_WORKING_DIR/build-x86-64/mesa/src/compiler/clc/mesa-clc"
          ln -sf "$MESON_WORKING_DIR/build-x86-64/mesa/src/compiler/spirv/vtn_bindgen2" "$MESON_WORKING_DIR/build-x86-64/mesa/src/compiler/spirv/vtn-bindgen2"
          echo "$MESON_WORKING_DIR/build-x86-64/mesa/src/compiler/clc" >> $GITHUB_PATH
          echo "$MESON_WORKING_DIR/build-x86-64/mesa/src/compiler/spirv" >> $GITHUB_PATH
          echo "$MESON_WORKING_DIR/build-x86-64/mesa/src/panfrost/clc" >> $GITHUB_PATH

      - name: Build Variant B — Unpatched Upstream Android PanVK + Runtime Hook Shim
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
          export PATH="$MESON_WORKING_DIR/build-x86-64/mesa/src/compiler/clc:$MESON_WORKING_DIR/build-x86-64/mesa/src/compiler/spirv:$MESON_WORKING_DIR/build-x86-64/mesa/src/panfrost/clc:$PATH"
          export PKG_CONFIG_LIBDIR="$MESON_WORKING_DIR/shims"

          envsubst < android.toml > /tmp/android_wrapper.toml
          meson setup build-android/mesa-unpatched mesa \
              --cross-file /tmp/android_wrapper.toml \
              -Dbuildtype=${{ matrix.build-type }} \
              -Dplatforms=android,x11 \
              -Dandroid-stub=true \
              -Dandroid-libbacktrace=disabled \
              -Dplatform-sdk-version=30 \
              -Dglx=disabled \
              -Dgbm=disabled \
              -Degl=disabled \
              -Dopengl=false \
              -Dgles1=disabled \
              -Dgles2=disabled \
              -Dglvnd=disabled \
              -Dvalgrind=disabled \
              -Dgallium-drivers= \
              -Dshared-glapi=disabled \
              -Dzstd=disabled \
              -Dmesa-clc=system \
              -Dprecomp-compiler=system \
              -Dvulkan-drivers=panfrost \
              -Dllvm=disabled

          meson compile -C build-android/mesa-unpatched
          mkdir -p dist-artifact
          cp build-android/mesa-unpatched/src/panfrost/vulkan/libvulkan_panfrost.so dist-artifact/libvulkan_panfrost_unpatched.so

      - name: Apply Idempotent Mesa Full-File Overlay (mesa_overlay/) & Build Variant A (Patched Android PanVK)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export MESON_WORKING_DIR="$GITHUB_WORKSPACE"
          export PATH="$MESON_WORKING_DIR/build-x86-64/mesa/src/compiler/clc:$MESON_WORKING_DIR/build-x86-64/mesa/src/compiler/spirv:$MESON_WORKING_DIR/build-x86-64/mesa/src/panfrost/clc:$PATH"
          export PKG_CONFIG_LIBDIR="$MESON_WORKING_DIR/shims"

          chmod +x scripts/apply_mesa_overlay.sh
          ./scripts/apply_mesa_overlay.sh mesa

          envsubst < android.toml > /tmp/android_wrapper.toml
          meson setup build-android/mesa mesa --reconfigure \
              --cross-file /tmp/android_wrapper.toml \
              -Dbuildtype=${{ matrix.build-type }} \
              -Dplatforms=android,x11 \
              -Dandroid-stub=true \
              -Dandroid-libbacktrace=disabled \
              -Dplatform-sdk-version=30 \
              -Dglx=disabled \
              -Dgbm=disabled \
              -Degl=disabled \
              -Dopengl=false \
              -Dgles1=disabled \
              -Dgles2=disabled \
              -Dglvnd=disabled \
              -Dvalgrind=disabled \
              -Dgallium-drivers= \
              -Dshared-glapi=disabled \
              -Dzstd=disabled \
              -Dmesa-clc=system \
              -Dprecomp-compiler=system \
              -Dvulkan-drivers=panfrost \
              -Dllvm=disabled

          meson compile -C build-android/mesa
          mkdir -p dist-artifact
          cp build-android/mesa/src/panfrost/vulkan/libvulkan_panfrost.so build-android/libvulkan_panfrost.unstripped.so
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip -o build-android/libvulkan_panfrost.so build-android/libvulkan_panfrost.unstripped.so
          cp build-android/libvulkan_panfrost.so dist-artifact/libvulkan_panfrost.so
          cp build-android/libvulkan_panfrost.unstripped.so dist-artifact/libvulkan_panfrost.unstripped.so
          cp build-android/libpanthor_kbase_adapter.so dist-artifact/
          cp build-android/libmali_kbase_emu.so dist-artifact/

      - name: Upload Vulkan libvulkan_panfrost Artifacts (Patched & Unpatched Variants + Formal Reports)
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_panfrost-aarch64-dual-${{ matrix.build-type }}
          path: |
            dist-artifact/libvulkan_panfrost.so
            dist-artifact/libvulkan_panfrost.unstripped.so
            dist-artifact/libvulkan_panfrost_unpatched.so
            dist-artifact/libpanthor_kbase_adapter.so
            dist-artifact/libmali_kbase_emu.so
            artifacts/*
            mesa_overlay.patch
          if-no-files-found: error
