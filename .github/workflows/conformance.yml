name: Conformance & Formal Verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  conformance:
    name: Panthor-to-Kbase UAPI Conformance & CP-SAT Formal Proofs
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential llvm-dev libvulkan-dev vulkan-tools \
                                  mesa-vulkan-drivers python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install ortools

      - name: Execute Full Conformance Pipeline
        run: |
          ./scripts/run_conformance.sh

      - name: Publish Conformance Certification Summary
        run: |
          python3 - << 'PYEOF'
          import json, os
          with open("artifacts/conformance_report.json") as fp:
              report = json.load(fp)

          summary = "### Panthor-to-Kbase Formal Conformance Certification\n\n"
          summary += f"- **Conformance Status**: `{report.get('conformance_status')}`\n"
          summary += f"- **Specification**: {report.get('specification')}\n\n"
          summary += "#### Verified Workload Test Results\n"
          summary += "| Workload Stage | Key Verification Metric | Status |\n"
          summary += "| :--- | :--- | :--- |\n"
          for w in report.get("verification_components", {}).get("live_vulkan_workloads_verified", []):
              summary += f"| `{w.get('name')}` | `{json.dumps(w)}` | **PASS** |\n"

          summary += "\n#### Google OR-Tools CP-SAT Formal Theorem Prover Results\n"
          proofs = report.get("verification_components", {})
          summary += f"- **UAPI State Machine Safety**: `{proofs.get('uapi_state_machine_guarded_proof', {}).get('solver_status')}` (Proven violation-free: `{proofs.get('uapi_state_machine_guarded_proof', {}).get('proven_violation_free')}`)\n"
          summary += f"- **CSF Microcode Stream Equivalence**: `{proofs.get('csf_microcode_stream_symbolic_equivalence', {}).get('solver_status')}` (Proven all-paths equivalent: `{proofs.get('csf_microcode_stream_symbolic_equivalence', {}).get('proven_all_paths_equivalent')}`)\n"
          summary += f"- **Valhall 64-bit ISA Equivalence**: `{proofs.get('valhall_64bit_isa_symbolic_equivalence', {}).get('solver_status')}` (Proven all-inputs equivalent: `{proofs.get('valhall_64bit_isa_symbolic_equivalence', {}).get('proven_all_inputs_equivalent')}`)\n"

          print(summary)
          if "GITHUB_STEP_SUMMARY" in os.environ:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as sfp:
                  sfp.write(summary)
          PYEOF

      - name: Upload Conformance Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: conformance-certification-report
          path: |
            artifacts/conformance_report.json
            artifacts/live_workload_traces.json
            artifacts/ortools_equivalence_proof_report.json
            artifacts/ortools_modeled_constraints.pbtxt
            artifacts/lifted_uapi_and_csf_microcode_audit.json
            artifacts/lifted_shaders_spirv.txt
            artifacts/mali_kbase_ko_lifted_cfg.json
            artifacts/mali_kbase_ko_symbolic_proof_report.json
            artifacts/panvk_host_kbase_trace.json
